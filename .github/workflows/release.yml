name: Release

# Dispara ao empurrar uma tag de versão: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Cada sistema compila o próprio binário, em vez de tudo sair de um Mac.
    # Cross-compilar funciona, mas só o build nativo prova que o artefato abre.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar mise
        uses: jdx/mise-action@v2

      - name: Instalar dependências
        run: npm ci

      - name: Selftest
        run: npm test

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # Sem certificado de assinatura nos runners: build não assinado,
          # de propósito. Ver a seção de instalação no README.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: tokengotchi-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Feito com o gh em vez de uma action de release: a action criou três
      # drafts para a mesma tag numa execução só, espalhando os artefatos
      # entre eles. Aqui a criação é explícita e idempotente — se o draft já
      # existe, os arquivos só são anexados por cima.
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          # Este job não faz checkout (só baixa artefatos), então o gh não tem
          # repositório git de onde inferir o destino. Sem isto ele falha com
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(find artifacts -type f | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nenhum artefato baixado" >&2
            exit 1
          fi
          printf 'anexando %s arquivo(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --generate-notes \
              "${files[@]}"
          fi
