name: Release

# Dispara ao empurrar uma tag de versão: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Cada sistema compila o próprio binário, em vez de tudo sair de um Mac.
    # Cross-compilar funciona, mas só o build nativo prova que o artefato abre.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar mise
        uses: jdx/mise-action@v2

      # Os artefatos são nomeados a partir da versão do package.json, mas o
      # release recebe o nome da tag. Se as duas divergirem, sai um release
      # "v0.3.0" cheio de arquivos "0.2.0". Melhor falhar aqui do que publicar
      # isso e ter que refazer a tag depois.
      - name: Conferir se a tag bate com o package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $tag não bate com a versão do package.json ($pkg)." >&2
            echo "Rode: npm version ${tag#v} --no-git-tag-version, commite e refaça a tag." >&2
            exit 1
          fi
          echo "tag e package.json batem: $tag"

      - name: Instalar dependências
        run: npm ci

      - name: Selftest
        run: npm test

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # Sem certificado de assinatura nos runners: build não assinado,
          # de propósito. Ver a seção de instalação no README.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: tokengotchi-${{ matrix.os }}
          retention-days: 7
          # Precisa acompanhar os alvos em package.json > build. Um alvo novo
          # que não esteja aqui é descartado em silêncio e some do release.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Um único criador de release, explícito e idempotente. Os jobs de build
      # rodam com --publish never justamente para não competirem com este passo:
      # o electron-builder, ao ver GH_TOKEN e uma tag, publica um draft por
      # conta própria, e com três jobs em paralelo isso rendia drafts
      # duplicados com os artefatos espalhados entre eles.
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          # Este job não faz checkout (só baixa artefatos), então o gh não tem
          # repositório git de onde inferir o destino. Sem isto ele falha com
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(find artifacts -type f | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nenhum artefato baixado" >&2
            exit 1
          fi
          printf 'anexando %s arquivo(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          # Sobe em três tempos: cria como rascunho, anexa cada arquivo com
          # repetição, e só então publica. Assim o release só fica visível
          # quando está completo, e um upload que falhe não deixa um release
          # público pela metade.
          #
          # A repetição existe porque a API de upload devolve 400 esporádico em
          # arquivo grande — foi o que derrubou a primeira tentativa da v0.2.0,
          # num .AppImage de 121 MB. Subir um a um também evita que uma falha no
          # último arquivo descarte os oito que já tinham subido.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

          for file in "${files[@]}"; do
            nome=$(basename "$file")
            enviado=0
            for tentativa in 1 2 3 4; do
              if gh release upload "$TAG" "$file" --clobber; then
                echo "  ok: $nome"
                enviado=1
                break
              fi
              echo "  tentativa $tentativa falhou para $nome" >&2
              sleep $((tentativa * 15))
            done
            if [ "$enviado" -ne 1 ]; then
              echo "não consegui subir $nome após 4 tentativas" >&2
              exit 1
            fi
          done

          # Publica só no fim, com tudo anexado. Rascunho é invisível de fora:
          # a v0.1.0 passou dias parecendo que não tinha binário por causa disso.
          gh release edit "$TAG" --draft=false --latest
          echo "release publicado com ${#files[@]} arquivos"
