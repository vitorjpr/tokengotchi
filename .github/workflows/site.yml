name: Site

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # site/package.json has no engines field. Node 22 is the repo LTS (mise.toml).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Test
        working-directory: site
        run: npm test

      - name: Build
        working-directory: site
        run: npm run build
